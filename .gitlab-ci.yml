# ════════════════════════════════════════════════════════════════════
# sablier-traefik-plugin (miroir interne) — GitLab CI/CD
#
# Fork interne du plugin Traefik Sablier (upstream + fix Set-Cookie,
# PR upstream : https://github.com/sablierapp/sablier-traefik-plugin/pull/58).
#
# 1. test  : go test (les tests de régression du fix en font partie)
# 2. build : image Kaniko = SOURCES du plugin uniquement (Traefik charge les
#    plugins en source via Yaegi — l'image sert de véhicule registry interne,
#    l'initContainer du chart Traefik copie /plugin/ sur la PVC RWX).
#
# Sur un tag (ex. v1.3.0-fix.58) → image :<tag> + :latest ; sur main → :latest.
# ════════════════════════════════════════════════════════════════════

stages:
  - test
  - build

variables:
  GO_IMAGE: "docker.io/golang:1.24-alpine"
  KANIKO_IMAGE: "gcr.io/kaniko-project/executor:v1.23.2-debug"
  IMAGE_NAME: "${CI_REGISTRY_IMAGE}"

test:go:
  stage: test
  image: ${GO_IMAGE}
  interruptible: true
  script:
    - go vet ./...
    - go test ./...
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

build:plugin-source:
  stage: build
  image:
    name: ${KANIKO_IMAGE}
    entrypoint: [""]
  before_script:
    # Authentification au registry GitLab
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    # Sur un tag Git : tag versionné + latest ; sur main : latest uniquement
    - |
      DESTINATIONS="--destination ${IMAGE_NAME}:latest"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        DESTINATIONS="${DESTINATIONS} --destination ${IMAGE_NAME}:${CI_COMMIT_TAG}"
      fi
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Containerfile" \
        ${DESTINATIONS} \
        --snapshot-mode=redo \
        --compressed-caching=false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
